<title>Ciao, Milano! · Italiano A1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
:root{--f:'Plus Jakarta Sans',system-ui,sans-serif;--bg:#FAF6EF;--ink:#550218;--card:#FFFFFF;--cream:#FFFFFF;--lb:#DAE6FF;--blue:#90B8FF;--org:#FD69A0;--red:#FD69A0;--olive:#E0FFB0;--yel:#FFD12F;--pink:#FECCE1;--line:#F0E3E0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)} *{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--f);-webkit-tap-highlight-color:transparent}
main{max-width:640px;margin:0 auto;padding:18px 16px 120px;min-height:100vh}
h1,h2,h3{font-weight:800;letter-spacing:-.02em;margin:0} h2{font-size:2rem;margin:8px 0 2px} h3{font-size:1.3rem} p{margin:.3em 0} small{opacity:.75} .sub{margin:0 0 14px} #hd{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto;padding:14px 18px;background:#80003A;color:#fff;border-radius:0 0 28px 28px}
.logo{display:flex;align-items:center;gap:8px;font-size:1.45rem;font-weight:800;letter-spacing:-.03em} .logo .mc{background:var(--cream);border-radius:14px;padding:3px;transform:rotate(-6deg)}
.hs{color:var(--ink);display:flex;align-items:center;gap:6px;background:var(--card);border-radius:99px;padding:5px 12px 5px 6px;font-weight:800} .hs .ic{width:28px;height:28px;border-radius:10px} .hs svg{width:16px;height:16px}
mark{background:var(--yel);color:var(--ink);padding:1px 8px;display:inline-block;transform:skew(-4deg) rotate(-1deg);font-weight:800}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:var(--card);display:flex;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));border-radius:28px 28px 0 0;z-index:100;box-shadow:0 -8px 28px rgba(85,2,24,.09)}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--ink);opacity:.4;font-size:.74rem;font-weight:700;cursor:pointer;transition:all .25s}
#nav button.on{opacity:1;color:#80003A;transform:translateY(-2px)} #nav svg{width:22px;height:22px;fill:currentColor}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes popIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
#m>*{animation:slideUp .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*45ms)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}
.hero-txt{flex:1;min-width:0} .hero h1{font-size:2.1rem;line-height:1.08;margin:6px 0 10px}
.top-label{color:var(--ac);font-weight:800;font-size:.78rem;letter-spacing:1.2px;text-transform:uppercase}
.arch-img{width:130px;height:156px;flex:none;background:var(--org);border-radius:28px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.arch-img::before{content:'';position:absolute;inset:12px 8px 0;background:var(--cream);clip-path:polygon(16% 0,58% 7%,100% 0,90% 32%,100% 56%,86% 100%,8% 100%,0 62%,9% 30%)}
.arch-img .mc{position:relative;animation:float 3.5s ease-in-out infinite;margin-bottom:-4px}
.card,.stat,.unit{background:var(--card);color:var(--ink);border-radius:28px;padding:20px;margin:14px 0;transition:transform .2s}
.card:hover,.unit:hover{transform:translateY(-2px)}
.card.y{background:var(--yel)} .card.o{background:var(--olive)} .card.b,.card.lb{background:var(--lb)} .card.r{background:var(--org);color:var(--ink)} .card.p{background:var(--pink)}
.tag{display:inline-block;background:var(--card);border-radius:99px;padding:3px 12px;font-size:.76rem;font-weight:700}
.row2{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin:10px 0 12px}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.75);overflow:hidden} .meter i{display:block;height:100%;border-radius:99px;background:var(--blue);width:0;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;transform:rotate(-6deg);flex:none}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0} .stats2 .card{margin:0;padding:16px}
.n{display:block;font:800 1.9rem/1.1 var(--f);margin-top:10px} .bn{font:800 3.2rem/1 var(--f)} .streak{display:flex;align-items:center;gap:16px}
.week{display:flex;gap:6px;margin-bottom:18px}
.chip{flex:1;aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:.7rem;background:var(--card)}
.chip b{font-size:1.05rem;line-height:1.1} .chip.done{background:var(--org);color:var(--ink)} .chip.today{background:var(--ink);color:#fff}
button{font:inherit;cursor:pointer}
.go,.btns button{border:0;border-radius:999px;padding:12px 22px;background:var(--ink);color:#fff;font-weight:700;margin:10px 8px 0 0;transition:all .15s}
.btns button{background:var(--bg);color:var(--ink);padding:10px 16px;font-size:.92rem} .go.full{width:100%;margin:16px 0 0;padding:15px}
.go:hover,.btns button:not(:disabled):hover{transform:translateY(-2px)} .go:active,.btns button:not(:disabled):active{transform:scale(.97)}
.btns button:not(:disabled):hover{background:var(--yel)} .btns button:disabled{opacity:.4;cursor:not-allowed}
.unit{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative} .unit h3{margin:4px 0;font-size:1.4rem}
.unit .mw{position:relative;flex:none;display:block;border-radius:26px;padding:6px;transform:rotate(-6deg)}
.unit.y .mw{background:var(--yel)} .unit.p .mw{background:var(--pink)} .unit.b .mw{background:var(--lb)} .unit.o .mw{background:var(--olive)}
.unit.lock{opacity:.6} .unit.lock .mw{filter:grayscale(.7)}
.lk{position:absolute;right:-8px;bottom:-8px;width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;border:3px solid #fff;transform:rotate(6deg)}
.pill{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:99px;background:var(--lb);font-size:.82rem;font-weight:700}
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.x{border:0;background:var(--card);color:var(--ink);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800}
.bar{flex:1;height:12px;border-radius:99px;background:var(--card);overflow:hidden} .bar i{display:block;height:100%;border-radius:99px;background:var(--org);transition:width .4s ease-out}
.q .ins{font-size:.8rem;font-weight:800;color:#80003A;text-transform:uppercase;letter-spacing:1px} .q h3{font-size:1.9rem;margin:8px 0 16px;line-height:1.15}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 18px;border-radius:18px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;font-size:1.02rem;transition:all .15s}
.opt:not(:disabled):hover{border-color:var(--ink);transform:translateX(4px)}
.opt.good{background:var(--olive);border-color:var(--olive)} .opt.bad{background:var(--org);border-color:var(--org);color:var(--ink);animation:shake .35s}
